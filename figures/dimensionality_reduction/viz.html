<!doctype html>
<!-- Page for viz.py (served at /; data from /api/meta and /api/plot).
     A three.js scatter of object images with plotly-style walls, grid and ticks. -->
<html>
<head>
<meta charset="utf-8">
<title>dimensionality reduction explorer</title>
<style>
  body { margin: 0; font: 12px sans-serif; background: #fff; color: #222 }
  canvas { display: block }

  #top { padding: 6px 10px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center }
  #top label { white-space: nowrap }
  #top select { font: inherit }

  #wrap { position: relative; overflow: hidden }
  /* title and legend are placed by layout(), at the same spots as in the saved SVG */
  #title { position: absolute; font-size: 8px; line-height: 10px; color: #555; white-space: nowrap; pointer-events: none }
  #leg { position: absolute; display: flex; font-size: 10px; color: #222; pointer-events: none }
  #leg > div > div { height: 13px; display: flex; align-items: center; white-space: nowrap }
  #leg i { flex: none; display: inline-block }
  #tip { position: absolute; pointer-events: none; background: #fffe; border: 1px solid #999; padding: 2px 5px; display: none; white-space: nowrap }
  #busy { position: absolute; left: 50%; top: 40%; transform: translate(-50%); background: #fffd; padding: 8px 14px; border: 1px solid #ccc; display: none }

  #disp { position: relative }
  #disp > button { font: inherit }
  #dpanel { position: absolute; z-index: 10; top: 100%; left: 0; background: #fff; border: 1px solid #aaa; padding: 6px; display: none; width: 340px; box-shadow: 0 2px 8px #0003 }
  #dpanel input[type=text] { width: 100%; box-sizing: border-box; font: inherit; margin-bottom: 4px }
  #dlist { max-height: 60vh; overflow-y: auto }
  #dlist label { display: block; white-space: nowrap }
  #dlist .n { color: #999 }
</style>
</head>
<body>
<div id="top"></div>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="title"></div>
  <div id="leg"></div>
  <div id="tip"></div>
  <div id="busy">computing…</div>
</div>
<script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

function $(id) {
  return document.getElementById(id);
}
const canvas = $('c');
const tip = $('tip');
const META = await (await fetch('/api/meta')).json();

// ================================================================ controls
// Every setting is kept in the URL hash, so a reload or a shared link keeps the view.

function numbers(n) {  // ['1', '2', ..., 'n']
  const out = [];
  for (let i = 1; i <= n; i++) out.push(String(i));
  return out;
}

const DROPDOWNS = {
  box: META.box,
  speaker: META.speaker,
  object: META.object,
  vector: META.vector,
  split: META.split,
  method: META.method,
  colour: META.colour,
  size: META.size,
  best: META.best,
  x: numbers(10),
  y: numbers(10),
  z: ['none', ...numbers(10)],
};
const DEFAULTS = {x: '1', y: '2', z: '3'};
const saved = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));

function setOptions(select, options) {
  select.innerHTML = options.map(o => `<option>${o}</option>`).join('');
}

// PCA has 10 components, UMAP 3: refill the x / y / z dropdowns, keeping the current value when it still exists.
function setAxisOptions() {
  const n = $('method').value == 'umap' ? 3 : 10;
  for (const axis of ['x', 'y', 'z']) {
    const select = $(axis);
    const options = axis == 'z' ? ['none', ...numbers(n)] : numbers(n);
    const previous = select.value;
    setOptions(select, options);
    if (options.includes(previous)) select.value = previous;
    else if (options.includes(DEFAULTS[axis])) select.value = DEFAULTS[axis];
    else select.value = options[0];
  }
}

// With "best" on, the server picks x and y (z only says 2-D or 3-D).
function lockAxes() {
  const on = $('best').value != 'none';
  $('x').disabled = on;
  $('y').disabled = on;
  $('z').title = on ? 'none = best 2-D pair, a number = best 3' : '';
}

for (const [name, options] of Object.entries(DROPDOWNS)) {
  const label = document.createElement('label');
  const select = document.createElement('select');
  select.id = name;
  setOptions(select, options);
  select.value = saved[name] ?? DEFAULTS[name] ?? options[0];
  select.onchange = () => {
    if (name == 'best') lockAxes();
    if (name == 'method') setAxisOptions();
    load();
  };
  label.append(name + ' ', select);
  $('top').append(label);
}
if ($('method').value == 'umap') setAxisOptions();
lockAxes();

// ---- display picker: a searchable checklist of every split. Unticked = not drawn; the fit is unaffected.
function defaultDisplay() {
  return META.splits.filter(s => s[2]).map(s => s[0]);
}
const display = new Set(saved.display !== undefined ? saved.display.split(',').filter(x => x) : defaultDisplay());

const picker = document.createElement('span');
picker.id = 'disp';
picker.innerHTML = `<button></button>
  <div id="dpanel">
    <input type="text" placeholder="search splits… (Enter = tick matches only)">
    <div><button data-action="tick">tick shown</button> <button data-action="untick">untick shown</button> <button data-action="defaults">defaults</button></div>
    <div id="dlist"></div>
  </div>`;
$('top').append(picker);
const pickerButton = picker.querySelector('button');
const pickerPanel = picker.querySelector('#dpanel');
const pickerSearch = pickerPanel.querySelector('input');
const pickerList = pickerPanel.querySelector('#dlist');
pickerList.innerHTML = META.splits.map(([split, n]) => `<label><input type="checkbox" value="${split}"> ${split} <span class="n">${n}</span></label>`).join('');
const checkboxes = [...pickerList.querySelectorAll('input')];

// debounce: ticking several boxes sends one request
let displayTimer = 0;
function displayChanged() {
  for (const box of checkboxes) box.checked = display.has(box.value);
  pickerButton.textContent = `display ${display.size}/${checkboxes.length} splits ▾`;
  clearTimeout(displayTimer);
  displayTimer = setTimeout(load, 400);
}
function matchingCheckboxes() {  // the checkboxes the search box currently shows
  return checkboxes.filter(box => box.parentNode.style.display != 'none');
}
for (const box of checkboxes) {
  box.onchange = () => {
    if (box.checked) display.add(box.value);
    else display.delete(box.value);
    displayChanged();
  };
}
for (const button of pickerPanel.querySelectorAll('button')) {
  button.onclick = () => {
    const action = button.dataset.action;
    if (action == 'defaults') {
      display.clear();
      for (const split of defaultDisplay()) display.add(split);
    }
    if (action == 'tick') {
      for (const box of matchingCheckboxes()) display.add(box.value);
    }
    if (action == 'untick') {
      for (const box of matchingCheckboxes()) display.delete(box.value);
    }
    displayChanged();
  };
}
pickerSearch.oninput = () => {
  const words = pickerSearch.value.toLowerCase().split(/\s+/).filter(x => x);
  for (const box of checkboxes) {
    const match = words.every(word => box.value.toLowerCase().includes(word));
    box.parentNode.style.display = match ? '' : 'none';
  }
};
pickerSearch.onkeydown = e => {
  if (e.key == 'Enter') {
    const matches = matchingCheckboxes().map(box => box.value);
    display.clear();
    for (const split of matches) display.add(split);
    displayChanged();
  }
  if (e.key == 'Escape') pickerPanel.style.display = 'none';
};
pickerButton.onclick = () => {
  const open = pickerPanel.style.display != 'block';
  pickerPanel.style.display = open ? 'block' : 'none';
  if (open) pickerSearch.focus();
};
addEventListener('mousedown', e => {
  if (!picker.contains(e.target)) pickerPanel.style.display = 'none';
});
for (const box of checkboxes) box.checked = display.has(box.value);
pickerButton.textContent = `display ${display.size}/${checkboxes.length} splits ▾`;

// ---- image size slider
const sizeSlider = document.createElement('input');
sizeSlider.type = 'range';
sizeSlider.min = 4;
sizeSlider.max = 100;
sizeSlider.value = saved.img ?? 28;
const sizeLabel = document.createElement('label');
sizeLabel.append('image size ', sizeSlider);
$('top').append(sizeLabel);
function imageSize() {  // world size of an image
  return sizeSlider.value / 130;
}
sizeSlider.oninput = () => {
  for (const cloud of clouds) cloud.material.size = imageSize() * cloud.userData.scale;
  saveHash();
  render();
};

// ---- density slider: draw the first p% of a farthest-point order (evenly spread, nested, deterministic).
// The slider only changes draw ranges, it never asks the server.
const densitySlider = document.createElement('input');
densitySlider.type = 'range';
densitySlider.min = 0;
densitySlider.max = 100;
densitySlider.value = saved.density ?? 100;
const densityCount = document.createElement('span');
densityCount.style.color = '#777';
const densityLabel = document.createElement('label');
densityLabel.append('density ', densitySlider, ' ', densityCount);
$('top').append(densityLabel);
densitySlider.oninput = () => {
  applyDensity();
  saveHash();
  render();
};

// ---- save SVG button
const saveButton = document.createElement('button');
saveButton.textContent = 'save SVG';
saveButton.title = 'download the current view (this exact camera) as a cropped SVG';
saveButton.onclick = async () => {
  saveButton.disabled = true;
  saveButton.textContent = 'saving…';
  await new Promise(done => requestAnimationFrame(() => setTimeout(done, 0)));  // let the label paint first
  try {
    saveSvg();
  } finally {
    saveButton.disabled = false;
    saveButton.textContent = 'save SVG';
  }
};
$('top').append(saveButton);

const help = document.createElement('span');
help.style.color = '#777';
$('top').append(help);

function saveHash() {
  const params = {};
  for (const name of Object.keys(DROPDOWNS)) params[name] = $(name).value;
  params.img = sizeSlider.value;
  params.density = densitySlider.value;
  params.display = [...display].join(',');
  history.replaceState(null, '', '#' + new URLSearchParams(params));
}

// ================================================================ three.js scene
// The scene is rebuilt for every plot; the camera is kept unless the plot switches between 2-D and 3-D.

const renderer = new THREE.WebGLRenderer({canvas: canvas, antialias: true});
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0xffffff);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, .01, 100);
let controls = null;

let plot = null;      // the last /api/plot response (+ plot.rank, the farthest-point order)
let is3d = null;
let root = new THREE.Group();
let clouds = [];      // THREE.Points, one per object × colour × size
let walls = [];       // 3 groups: grey plane + white grid lines
let labels = [];      // per axis: {ticks: [[position, sprite], ...], title: sprite}
let layoutFrame = 0;  // pending requestAnimationFrame of layout()
scene.add(root);

const HOME_3D = [3.6, -4.2, 2.6];
const HOME_2D = [0, 0, 5.4];

// Reset the camera. OrbitControls fixes its orbit axis from camera.up when constructed, so it is rebuilt
// whenever up changes (a turntable around the vertical axis, like plotly).
function home() {
  if (is3d) {
    camera.up.set(0, 0, 1);
    camera.position.set(...HOME_3D);
  } else {
    camera.up.set(0, 1, 0);
    camera.position.set(...HOME_2D);
  }
  if (controls) controls.dispose();
  controls = new OrbitControls(camera, canvas);
  controls.addEventListener('change', render);
  controls.zoomSpeed = 1.5;
  controls.enableRotate = is3d;
  controls.mouseButtons.LEFT = is3d ? THREE.MOUSE.ROTATE : THREE.MOUSE.PAN;
  controls.target.set(0, 0, 0);
  controls.update();
  render();
}
canvas.ondblclick = home;

function resize() {
  const titleHeight = parseFloat($('wrap').style.paddingTop) || 0;
  const w = innerWidth;
  const h = Math.max(400, innerHeight - $('top').offsetHeight - titleHeight - 8);
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  render();
}
addEventListener('resize', resize);

// ---- textures
function loadImage(url) {
  return new Promise(done => {
    const image = new Image();
    image.onload = () => done(image);
    image.src = url;
  });
}
// per object: [picture, contour ring], or null when the object has no picture
const sprites = [];
for (const pair of META.sprites) {
  if (pair) sprites.push([await loadImage(pair[0]), await loadImage(pair[1])]);
  else sprites.push(null);
}

const TEX = 64;  // texture px (the sprites are 64 px); the drawn size comes from the point size, not from this
const textureCache = {};

// The marker of one object in one colour (cached):
//   object with a picture -> the picture, with its contour ring tinted in the point colour
//   empty box             -> a cross (the server always sends black for it)
//   object without picture-> a filled dot in the point colour
function markerTexture(objectIndex, colour) {
  const key = objectIndex + colour;
  if (textureCache[key]) return textureCache[key];
  const c = document.createElement('canvas');
  c.width = TEX;
  c.height = TEX;
  const ctx = c.getContext('2d');
  if (sprites[objectIndex]) {
    const [picture, ring] = sprites[objectIndex];
    ctx.drawImage(ring, 0, 0, TEX, TEX);
    ctx.globalCompositeOperation = 'source-in';  // keep the ring's shape, replace its colour
    ctx.fillStyle = colour;
    ctx.fillRect(0, 0, TEX, TEX);
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(picture, 0, 0, TEX, TEX);
  } else if (META.objects[objectIndex] == 'empty') {
    ctx.strokeStyle = colour;
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(14, 14);
    ctx.lineTo(50, 50);
    ctx.moveTo(50, 14);
    ctx.lineTo(14, 50);
    ctx.stroke();
  } else {
    ctx.fillStyle = colour;
    ctx.beginPath();
    ctx.arc(32, 32, 20, 0, 2 * Math.PI);
    ctx.fill();
  }
  const texture = new THREE.CanvasTexture(c);
  texture.colorSpace = THREE.SRGBColorSpace;
  textureCache[key] = texture;
  return texture;
}

function textSprite(string, px = 32, colour = '#444') {
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  ctx.font = px + 'px sans-serif';
  c.width = Math.ceil(ctx.measureText(string).width) + 8;
  c.height = px * 1.3;
  ctx.font = px + 'px sans-serif';  // resizing the canvas reset the font
  ctx.fillStyle = colour;
  ctx.textBaseline = 'middle';
  ctx.fillText(string, 4, c.height / 2);
  const texture = new THREE.CanvasTexture(c);
  texture.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({map: texture, depthTest: false}));
  sprite.userData = {string: string, colour: colour};
  const height = .09 * px / 40;
  sprite.scale.set(c.width / c.height * height, height, 1);
  return sprite;
}

// ---- build the scene for the current plot
function build() {
  // free the old scene (marker textures are cached and reused, label textures are not)
  const cached = Object.values(textureCache);
  root.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material && o.material.map && !cached.includes(o.material.map)) o.material.map.dispose();
  });
  scene.remove(root);
  root = new THREE.Group();
  scene.add(root);

  // points: [x, y, z, object index, colour, hover text, size]. One draw call per object × colour × size.
  const points = plot.pts;
  const groups = {};
  points.forEach((p, n) => {
    const key = p[3] + '|' + p[4] + '|' + p[6];
    if (!groups[key]) groups[key] = {objectIndex: p[3], colour: p[4], scale: p[6], members: []};
    groups[key].members.push(n);
  });
  clouds = [];
  for (const group of Object.values(groups)) {
    // farthest-point order inside the group, so density is a draw-range prefix
    group.members.sort((a, b) => plot.rank[a] - plot.rank[b]);
    const positions = [];
    for (const n of group.members) positions.push(points[n][0], points[n][1], points[n][2]);
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    const material = new THREE.PointsMaterial({
      size: imageSize() * group.scale,
      map: markerTexture(group.objectIndex, group.colour),
      alphaTest: .5,
      sizeAttenuation: true,
    });
    const cloud = new THREE.Points(geometry, material);
    cloud.userData.members = group.members;
    cloud.userData.scale = group.scale;
    root.add(cloud);
    clouds.push(cloud);
  }
  applyDensity();

  // plotly-style axes: grey walls with white grid lines at the ticks. render() moves the walls to the far side of the camera.
  const ticks = is3d ? plot.ticks : [...plot.ticks, []];
  walls = [];
  for (let j = 0; j < 3; j++) {  // wall j is perpendicular to axis j and spans axes a and b
    const a = (j + 1) % 3;
    const b = (j + 2) % 3;
    const wall = new THREE.Group();

    const plane = new THREE.Mesh(
      new THREE.PlaneGeometry(2, 2),
      new THREE.MeshBasicMaterial({color: 0xe5ecf6, side: THREE.DoubleSide, depthWrite: false}));
    const normal = [0, 0, 0];
    normal[j] = 1;
    plane.lookAt(...normal);
    wall.add(plane);

    const lines = [];
    function addLine(a0, b0, a1, b1) {
      const from = [0, 0, 0];
      const to = [0, 0, 0];
      from[a] = a0;
      from[b] = b0;
      to[a] = a1;
      to[b] = b1;
      lines.push(...from, ...to);
    }
    for (const tick of ticks[a]) addLine(tick[0], -1, tick[0], 1);
    for (const tick of ticks[b]) addLine(-1, tick[0], 1, tick[0]);
    const lineGeometry = new THREE.BufferGeometry();
    lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(lines, 3));
    wall.add(new THREE.LineSegments(lineGeometry, new THREE.LineBasicMaterial({color: 0xffffff})));

    wall.visible = is3d || j == 2;
    root.add(wall);
    walls.push(wall);
  }

  labels = [];
  plot.axes.forEach((name, j) => {
    const tickSprites = [];
    for (const tick of ticks[j]) {
      const sprite = textSprite(tick[1]);
      root.add(sprite);
      tickSprites.push([tick[0], sprite]);
    }
    const title = textSprite(name, 40, '#222');
    root.add(title);
    labels.push({ticks: tickSprites, title: title});
  });
}

function render() {
  if (!plot) {
    renderer.render(scene, camera);
    return;
  }
  // side[j] = which side of axis j the camera is on; walls go to the far side, labels to the near edges
  const offset = camera.position.clone().sub(controls ? controls.target : new THREE.Vector3());
  const side = [0, 1, 2].map(j => Math.sign(offset.getComponent(j)) || 1);
  if (!is3d) {  // 2-D: x labels below, y labels left
    side[0] = -1;
    side[1] = -1;
    side[2] = 1;
  }
  walls.forEach((wall, j) => {
    const position = [0, 0, 0];
    position[j] = -side[j] * (is3d ? 1 : .01);
    wall.position.set(...position);
  });

  labels.forEach((label, j) => {
    // a point at `t` along axis j, pushed `distance` out of the cube
    function labelPosition(t, distance) {
      const q = [0, 0, 0];
      q[j] = t;
      if (j < 2) {
        const other = 1 - j;
        q[other] = side[other] * distance;
        q[2] = is3d ? -1 : 0;
      } else {
        q[0] = side[0] * distance;
        q[1] = -side[1];
      }
      return q;
    }
    // Offsets come from each label's own size, so its inner edge sits 0.03 off the wall:
    // 2-D x labels move by half their height, y labels by half their width; 3-D by about the larger half.
    function halfSize(sprite) {
      if (is3d) return .35 * Math.max(sprite.scale.x, sprite.scale.y);
      if (j == 0) return sprite.scale.y / 2;
      return sprite.scale.x / 2;
    }
    let widestTick = 0;
    for (const [t, sprite] of label.ticks) {
      sprite.position.set(...labelPosition(t, 1.03 + halfSize(sprite)));
      widestTick = Math.max(widestTick, halfSize(sprite));
    }
    const titlePosition = labelPosition(0, 1.03 + 2 * widestTick + .03 + halfSize(label.title));
    if (j == 2) titlePosition[2] = 0;
    label.title.position.set(...titlePosition);
  });

  renderer.render(scene, camera);
  // the title and legend follow the drawn bounds
  if (!layoutFrame) {
    layoutFrame = requestAnimationFrame(() => {
      layoutFrame = 0;
      layout();
    });
  }
}

// ---- density
// Greedy farthest-point order over the drawn coordinates, starting from the point nearest the centre.
// Returns rank[n] = position of point n in that order.
function farthestPointOrder(points) {
  const n = points.length;
  const distance = new Float64Array(n).fill(Infinity);  // squared distance to the nearest already-ranked point
  const rank = new Int32Array(n);
  const done = new Uint8Array(n);

  let current = 0;
  let smallest = Infinity;
  for (let i = 0; i < n; i++) {
    const r2 = points[i][0] ** 2 + points[i][1] ** 2 + points[i][2] ** 2;
    if (r2 < smallest) {
      smallest = r2;
      current = i;
    }
  }
  for (let k = 0; k < n; k++) {
    rank[current] = k;
    done[current] = 1;
    const [x, y, z] = points[current];
    let farthest = -1;
    let farthestDistance = -1;
    for (let i = 0; i < n; i++) {
      if (done[i]) continue;
      const d = (points[i][0] - x) ** 2 + (points[i][1] - y) ** 2 + (points[i][2] - z) ** 2;
      if (d < distance[i]) distance[i] = d;
      if (distance[i] > farthestDistance) {
        farthestDistance = distance[i];
        farthest = i;
      }
    }
    current = farthest;
  }
  return rank;
}

function shownCount() {  // how many points the density slider keeps
  return Math.round(densitySlider.value / 100 * plot.pts.length);
}

// Draw the first shownCount() points of the farthest-point order: per cloud, the prefix with a smaller rank.
// Hover, the SVG and the crop all respect the draw range.
function applyDensity() {
  if (!plot) return;
  const k = shownCount();
  for (const cloud of clouds) {
    const members = cloud.userData.members;
    let count = 0;
    while (count < members.length && plot.rank[members[count]] < k) count++;
    cloud.geometry.setDrawRange(0, count);
  }
  densityCount.textContent = `${k}/${plot.pts.length}`;
}

// ================================================================ load a plot from the server

let requestNumber = 0;
async function load() {
  saveHash();
  requestNumber += 1;
  const mine = requestNumber;
  $('busy').style.display = 'block';
  const query = new URLSearchParams();
  for (const name of Object.keys(DROPDOWNS)) query.set(name, $(name).value);
  query.set('display', [...display].join(','));
  const response = await (await fetch('/api/plot?' + query)).json();
  if (mine != requestNumber) return;  // a newer request superseded this one
  $('busy').style.display = 'none';
  if (response.error) {
    $('title').textContent = '⚠ ' + response.error;
    return;
  }
  const was3d = is3d;
  plot = response;
  is3d = response.d3;
  plot.rank = farthestPointOrder(plot.pts);
  build();
  if ($('best').value != 'none') {  // show the components the server picked
    $('x').value = response.picked[0];
    $('y').value = response.picked[1];
    if (response.picked[2]) $('z').value = response.picked[2];
    saveHash();
  }
  if (is3d) help.textContent = 'drag = rotate, right-drag / shift-drag = pan, scroll = zoom, double-click = reset';
  else help.textContent = 'drag = pan, scroll = zoom, double-click = reset';
  if (was3d !== is3d) home();
  resize();
}

// ================================================================ figure layout
// Shared by the live view (layout) and the SVG (saveSvg): project the scene through the current camera, crop to the
// drawn content, put a small title (wrapped to the figure width) above it and the legend column(s) right of it.

const LEGEND_ROW = 13;  // px
const TITLE_FONT = 8;   // px

function r1(x) {  // 1 decimal, for compact SVG numbers
  return +x.toFixed(1);
}
function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
const measureContext = document.createElement('canvas').getContext('2d');
function textWidth(string, px, bold) {  // same font as the SVG
  measureContext.font = `${bold ? 'bold ' : ''}${px}px sans-serif`;
  return measureContext.measureText(string).width;
}

// Every setting in one line, parts separated by ' · '. The server part covers the dropdowns and the display picker;
// the sliders live only in the page, so they are added here (and stay live without a server request).
function titleText() {
  const total = plot.pts.length;
  const shown = shownCount();
  const parts = [
    plot.title,
    `image size ${sizeSlider.value}`,
    `density ${densitySlider.value}% (${shown} of ${total} points shown, ${total - shown} removed)`,
    META.ckpt,
  ];
  return parts.join(' · ');
}

// Project everything drawn to canvas px. Returns the bounding box bb = [x0, y0, x1, y1] and, when svg is true,
// the SVG elements (body) and the marker images they reference (defs). The live view only needs bb.
function project(svg) {
  root.updateMatrixWorld(true);
  camera.updateMatrixWorld();
  const W = canvas.clientWidth;
  const H = canvas.clientHeight;
  const focal = H / 2;
  const tanHalfFov = Math.tan(camera.fov * Math.PI / 360);

  function toScreen(v) {  // world point -> [x px, y px, depth]
    const depth = -v.clone().applyMatrix4(camera.matrixWorldInverse).z;
    const q = v.clone().project(camera);
    return [(q.x + 1) / 2 * W, (1 - q.y) / 2 * H, depth];
  }
  const bb = [1e9, 1e9, -1e9, -1e9];
  function grow(x0, y0, x1, y1) {
    bb[0] = Math.min(bb[0], x0);
    bb[1] = Math.min(bb[1], y0);
    bb[2] = Math.max(bb[2], x1);
    bb[3] = Math.max(bb[3], y1);
  }
  const body = [];
  const defs = {};

  // walls: grey polygon + white grid lines
  for (const wall of walls) {
    if (!wall.visible) continue;
    for (const part of wall.children) {
      if (!part.isMesh && !svg) continue;  // grid lines lie inside the plane, they never grow bb
      const attribute = part.geometry.attributes.position;
      const corners = [];
      for (let i = 0; i < attribute.count; i++) {
        const vertex = new THREE.Vector3().fromBufferAttribute(attribute, i).applyMatrix4(part.matrixWorld);
        corners.push(toScreen(vertex));
      }
      if (part.isMesh) {
        const polygon = [corners[0], corners[1], corners[3], corners[2]];
        for (const p of polygon) grow(p[0], p[1], p[0], p[1]);
        if (svg) {
          const pointList = polygon.map(p => r1(p[0]) + ',' + r1(p[1])).join(' ');
          body.push(`<polygon points="${pointList}" fill="#e5ecf6"/>`);
        }
      } else {
        for (let i = 0; i < corners.length; i += 2) {
          const from = corners[i];
          const to = corners[i + 1];
          body.push(`<line x1="${r1(from[0])}" y1="${r1(from[1])}" x2="${r1(to[0])}" y2="${r1(to[1])}" stroke="#fff" stroke-width="1"/>`);
        }
      }
    }
  }

  // markers, drawn far to near
  const markers = [];
  const vertex = new THREE.Vector3();
  for (const cloud of clouds) {
    const attribute = cloud.geometry.attributes.position;
    const texture = cloud.material.map;
    if (svg && !defs[texture.uuid]) {
      const url = texture.image.toDataURL();
      defs[texture.uuid] = `<image id="t${Object.keys(defs).length}" width="${TEX}" height="${TEX}" href="${url}" xlink:href="${url}"/>`;
    }
    const id = 't' + Object.keys(defs).indexOf(texture.uuid);
    const drawn = Math.min(attribute.count, cloud.geometry.drawRange.count);
    for (let i = 0; i < drawn; i++) {
      const [x, y, depth] = toScreen(vertex.fromBufferAttribute(attribute, i));
      if (depth <= 0) continue;
      const size = cloud.material.size * focal / depth;
      if (svg) markers.push([depth, x, y, size, id]);
      grow(x - size / 2, y - size / 2, x + size / 2, y + size / 2);
    }
  }
  markers.sort((a, b) => b[0] - a[0]);
  for (const [depth, x, y, size, id] of markers) {
    body.push(`<use href="#${id}" xlink:href="#${id}" transform="translate(${r1(x - size / 2)},${r1(y - size / 2)}) scale(${(size / TEX).toFixed(5)})"/>`);
  }

  // tick labels and axis titles
  for (const label of labels) {
    const textSprites = label.ticks.map(tick => tick[1]);
    textSprites.push(label.title);
    for (const sprite of textSprites) {
      const [x, y, depth] = toScreen(sprite.position);
      if (depth <= 0) continue;
      const fontSize = sprite.scale.y * focal / (depth * tanHalfFov) / 1.3;
      const width = sprite.scale.x * focal / (depth * tanHalfFov);
      grow(x - width / 2, y - fontSize * .65, x + width / 2, y + fontSize * .65);
      if (svg) {
        body.push(`<text x="${r1(x)}" y="${r1(y)}" font-size="${fontSize.toFixed(1)}" fill="${sprite.userData.colour}" text-anchor="middle" dominant-baseline="central">${escapeHtml(sprite.userData.string)}</text>`);
      }
    }
  }

  // bb is the full extent of everything drawn at this camera, NOT clipped to the screen (off-screen labels still land in the SVG)
  bb[0] -= 4;
  bb[1] -= 4;
  bb[2] += 4;
  bb[3] += 4;
  return {bb, body, defs};
}

// Legend columns and title lines for a plot cropped to bb (all positions relative to the crop's top-left).
function figure(bb) {
  const plotWidth = bb[2] - bb[0];
  const plotHeight = bb[3] - bb[1];

  // legend rows: ['h', heading] | ['c', label, colour] | ['s', label, size]
  const rows = [];
  if (Object.keys(plot.legend).length) rows.push(['h', 'colour']);
  for (const [label, colour] of Object.entries(plot.legend)) rows.push(['c', label, colour]);
  if (Object.keys(plot.size_legend).length) rows.push(['h', 'size']);
  for (const [label, size] of Object.entries(plot.size_legend)) rows.push(['s', label, size]);

  const rowsPerColumn = Math.max(8, Math.floor(plotHeight / LEGEND_ROW));
  const columns = [];
  rows.forEach((row, i) => {
    const c = Math.floor(i / rowsPerColumn);
    if (!columns[c]) columns[c] = [];
    columns[c].push(row);
  });
  const columnWidths = [];
  let legendWidth = columns.length ? 6 : 0;
  for (const column of columns) {
    let widest = 0;
    for (const row of column) widest = Math.max(widest, textWidth(row[1], 10, row[0] == 'h'));
    columnWidths.push(26 + widest);
    legendWidth += 26 + widest;
  }
  const totalWidth = plotWidth + legendWidth;

  // title: small, wrapped to the figure width at the ' · ' separators
  const titleLines = [];
  let line = '';
  for (const part of titleText().split(' · ')) {
    const longer = line ? line + ' · ' + part : part;
    if (textWidth(longer, TITLE_FONT) > totalWidth && line) {
      titleLines.push(line);
      line = part;
    } else {
      line = longer;
    }
  }
  titleLines.push(line);
  const titleHeight = titleLines.length * TITLE_FONT * 1.25 + 3;

  return {plotWidth, plotHeight, rows, rowsPerColumn, columns, columnWidths, totalWidth, titleLines, titleHeight};
}

// Live view: title and legend exactly where the SVG puts them. #wrap gets a top padding so the title never covers the control bar.
function layout() {
  if (!plot) return;
  const full = project(false).bb;
  const bb = [Math.max(full[0], 0), Math.max(full[1], 0), Math.min(full[2], canvas.clientWidth), Math.min(full[3], canvas.clientHeight)];  // clamped to the canvas
  const fig = figure(bb);
  const pad = Math.ceil(fig.titleHeight);
  if ($('wrap').style.paddingTop != pad + 'px') {
    $('wrap').style.paddingTop = pad + 'px';
    resize();  // resize -> render -> layout again
    return;
  }
  const title = $('title');
  title.innerHTML = fig.titleLines.map(escapeHtml).join('<br>');
  title.style.left = bb[0] + 'px';
  title.style.top = (pad + bb[1] - fig.titleHeight) + 'px';

  const legend = $('leg');
  legend.style.left = (bb[2] + 6) + 'px';
  legend.style.top = (pad + bb[1]) + 'px';
  let legendHtml = '';
  fig.columns.forEach((column, c) => {
    legendHtml += `<div style="width:${fig.columnWidths[c]}px">`;
    for (const [kind, label, value] of column) {
      if (kind == 'h') {
        legendHtml += `<div><b>${escapeHtml(label)}</b></div>`;
      } else if (kind == 'c') {
        legendHtml += `<div><i style="width:9px;height:9px;margin-right:5px;background:${value}"></i>${escapeHtml(label)}</div>`;
      } else {
        const diameter = 10 * value;
        legendHtml += `<div><i style="width:${diameter}px;height:${diameter}px;border-radius:50%;background:#444;margin-left:${4.5 - 5 * value}px;margin-right:${9.5 - 5 * value}px"></i>${escapeHtml(label)}</div>`;
      }
    }
    legendHtml += `</div>`;
  });
  legend.innerHTML = legendHtml;
}

// Download the current view (this exact camera) as a cropped SVG.
function saveSvg() {
  if (!plot) return;
  render();
  const {bb, body, defs} = project(true);
  const fig = figure(bb);

  const legend = [];
  let columnX = fig.plotWidth + 6;
  fig.columns.forEach((column, c) => {
    column.forEach(([kind, label, value], i) => {
      const y = i * LEGEND_ROW + LEGEND_ROW / 2;
      if (kind == 'h') {
        legend.push(`<text x="${r1(columnX)}" y="${y}" font-size="10" font-weight="bold" fill="#222" dominant-baseline="central">${escapeHtml(label)}</text>`);
        return;
      }
      if (kind == 'c') legend.push(`<rect x="${r1(columnX)}" y="${y - 4.5}" width="9" height="9" fill="${value}"/>`);
      else legend.push(`<circle cx="${r1(columnX + 4.5)}" cy="${y}" r="${(5 * value).toFixed(1)}" fill="#444"/>`);
      legend.push(`<text x="${r1(columnX + 14)}" y="${y}" font-size="10" fill="#222" dominant-baseline="central">${escapeHtml(label)}</text>`);
    });
    columnX += fig.columnWidths[c];
  });

  const titleSvg = fig.titleLines.map((text, i) =>
    `<text x="0" y="${r1((i + .5) * TITLE_FONT * 1.25)}" font-size="${TITLE_FONT}" fill="#555" dominant-baseline="central">${escapeHtml(text)}</text>`);
  const legendHeight = Math.min(fig.rows.length, fig.rowsPerColumn) * LEGEND_ROW;
  const totalHeight = fig.titleHeight + Math.max(fig.plotHeight, legendHeight);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 ${r1(fig.totalWidth)} ${r1(totalHeight)}" preserveAspectRatio="xMidYMid meet" font-family="sans-serif">
<defs>${Object.values(defs).join('')}</defs>
<rect width="100%" height="100%" fill="#fff"/>
${titleSvg.join('\n')}
<g transform="translate(${r1(-bb[0])},${r1(fig.titleHeight - bb[1])})">
${body.join('\n')}
</g>
<g transform="translate(0,${r1(fig.titleHeight)})">${legend.join('')}</g>
</svg>`;

  const settings = ['vector', 'method', 'colour'].map(name => $(name).value).join('_');
  const link = document.createElement('a');
  link.href = URL.createObjectURL(new Blob([svg], {type: 'image/svg+xml'}));
  link.download = `nb137_${META.run}_${settings}_${plot.axes.length}d.svg`;
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}

// ================================================================ hover: the nearest image under the cursor

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hoverFrame = 0;
canvas.onmousemove = e => {
  if (hoverFrame || !plot) return;
  hoverFrame = requestAnimationFrame(() => {
    hoverFrame = 0;
    mouse.set(e.offsetX / canvas.clientWidth * 2 - 1, -e.offsetY / canvas.clientHeight * 2 + 1);
    raycaster.params.Points.threshold = imageSize() * .35;
    raycaster.setFromCamera(mouse, camera);
    const hit = raycaster.intersectObjects(clouds)[0];
    if (!hit) {
      tip.style.display = 'none';
      return;
    }
    const point = plot.pts[hit.object.userData.members[hit.index]];
    tip.style.display = 'block';
    tip.style.left = (e.offsetX + 12) + 'px';
    tip.style.top = (e.offsetY + 12 + canvas.offsetTop) + 'px';
    tip.innerHTML = point[5];
  });
};
canvas.onmouseleave = () => {
  tip.style.display = 'none';
};

load();
</script>
</body>
</html>
