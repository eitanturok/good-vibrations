<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
  --bg: #ffffff; --card: #ffffff; --frame: #f5f5f7; --head: rgba(0,0,0,.04); --ink: #1d1d1f; --muted: #86868b; --hair: #d2d2d7; --edge: #b0b0b6; --accent: #0071e3; --scrim: rgba(0,0,0,.18);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #000; --card: #1c1c1e; --frame: #111113; --head: rgba(255,255,255,.05); --ink: #f5f5f7; --muted: #8e8e93; --hair: #38383a; --edge: #5f5f64; --accent: #2997ff; --scrim: rgba(0,0,0,.6); color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #000; --card: #1c1c1e; --frame: #111113; --head: rgba(255,255,255,.05); --ink: #f5f5f7; --muted: #8e8e93; --hair: #38383a; --edge: #5f5f64; --accent: #2997ff; --scrim: rgba(0,0,0,.6); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "SF Pro Text", "Helvetica Neue", Inter, sans-serif; -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; display: flex; flex-direction: column; }
header { width: 100%; max-width: 1400px; margin: 0 auto; padding: 18px 32px 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
.meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
.ctl { display: flex; gap: 10px; }
.seg { display: inline-flex; border: 1px solid var(--hair); border-radius: 999px; padding: 2px; }
.seg button { font: inherit; font-size: 12.5px; color: var(--muted); background: none; border: 0; border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
#canvas { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center; padding: 8px 24px 0; }
#canvas svg { display: block; width: 100%; max-width: 1400px; height: auto; max-height: calc(100vh - 122px); }
body.stack #canvas { overflow-x: auto; }
body.stack #canvas svg { max-height: none; width: auto; max-width: none; }
footer { padding: 4px 24px 12px; color: var(--muted); font-size: 12px; text-align: center; }
#tip { position: fixed; pointer-events: none; z-index: 10; max-width: 340px; background: var(--card); border: 1px solid var(--hair); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.08); padding: 10px 12px; font-size: 12.5px; display: none; }
#tip b { font-weight: 600; } #tip div { color: var(--muted); margin-top: 2px; } #tip code { font: 11.5px ui-monospace, "SF Mono", Menlo, monospace; }
.err { max-width: 980px; margin: 24px auto; padding: 0 24px; } .err pre { font: 12px ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); white-space: pre-wrap; border-top: 1px solid var(--hair); padding-top: 16px; }

svg text { fill: var(--ink); font-family: system-ui, -apple-system, "SF Pro Text", "Helvetica Neue", Inter, sans-serif; }
.sec .st { font-size: 13px; font-weight: 600; letter-spacing: .02em; }
.sec .sw { font-size: 12.5px; fill: var(--muted); }
.sec line { stroke: var(--hair); }
.card rect.c { fill: var(--card); stroke: var(--hair); }
.card.go { cursor: pointer; }
.card.go:hover rect.c { stroke: var(--accent); }
.card .t { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.card.small .t { font-size: 13px; }
.card .w { font-size: 12px; fill: var(--muted); }
.card.small .w { font-size: 11.5px; }
.card .p { font-size: 10.5px; fill: var(--muted); }
.rail rect { fill: var(--card); stroke: var(--hair); } .rail { cursor: pointer; } .rail:hover rect { stroke: var(--accent); }
.rail text { font-size: 12px; font-weight: 500; }
.sec .st.on { fill: var(--accent); }
.frame .back { font-size: 12px; fill: var(--accent); cursor: pointer; }
.frame.focus rect.f { fill: var(--bg); stroke: var(--hair); }
#back { font: inherit; font-size: 13px; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; margin-left: 10px; }
#canvas svg { animation: appear .2s ease; transform-origin: 50% 40%; }
@keyframes appear { from { opacity: .35; transform: scale(.985); } }
.card .hdr { fill: var(--head); }
.card .sep { stroke: var(--hair); }
.card .spine { stroke: var(--hair); }
.card .dot { fill: var(--muted); }
.card .rt { font-size: 11.5px; font-weight: 600; }
.card .rw { font-size: 11px; fill: var(--muted); }
.chev { fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.card.go:hover .chev { stroke: var(--accent); }
.lat rect { fill: var(--card); stroke: var(--ink); stroke-width: 1.2; }
.lat .t { font-size: 13px; font-weight: 600; }
.lat .d { font: 12px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--muted); }
.lat .w { font-size: 11.5px; fill: var(--muted); }
.frame rect.f { fill: var(--frame); }
.frame path.hd { fill: var(--head); }
.frame .fh { cursor: pointer; }
.frame .t { font-size: 14px; font-weight: 600; }
.frame .w { font-size: 12px; fill: var(--muted); }
.frame .fh:hover .t { fill: var(--accent); }
.op rect, .op circle { fill: var(--card); stroke: var(--hair); }
.op text { font-size: 11.5px; fill: var(--muted); }
.op .sym { font-size: 14px; }
.par text { font-size: 11px; fill: var(--muted); }
.par rect { fill: none; stroke: var(--hair); stroke-dasharray: 2 2; }
.io .t { font-size: 13.5px; font-weight: 600; }
.io .w { font-size: 10.5px; fill: var(--muted); letter-spacing: .06em; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.1; stroke-linejoin: round; }
.arrow { fill: var(--edge); }
.lab { font: 11px ui-monospace, "SF Mono", Menlo, monospace; fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.panel .lab { stroke: var(--card); }
.lab.inf { stroke: var(--frame); }
</style>
</head>
<body>
<header id="hdr"></header>
<div id="canvas"></div>
<footer id="foot"></footer>
<div id="tip"></div>
<script>
const DATA = /*__DATA__*/null;
(function () {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtN = n => n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 1 : 2) + "M" : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + "k" : String(n);
if (!DATA || DATA.error) {
  $("#hdr").innerHTML = `<div><h1>Could not trace the model</h1><div class="meta">${esc(DATA?.meta?.arch)} · ${esc(DATA?.meta?.time)}</div></div>`;
  $("#canvas").innerHTML = `<div class="err"><pre>${esc(DATA ? DATA.error : "no data")}</pre></div>`;
  return;
}
const M = DATA.meta, N = DATA.nodes, ROOT = String(DATA.root), DIMS = DATA.dims, DL = DATA.dimlist, B = M.B;
const node = id => N[String(id)];
const st = { open: {}, detail: false, letters: true, focus: null };
const sh = t => esc(t).replace(/\b([A-Z])_([a-z])\b/g, '$1<tspan baseline-shift="sub" font-size="75%">$2</tspan>');   // D_l -> D with a subscript l

// ---------- shapes: no batch dim; letters or numbers ----------
const used = new Set();
const shapeStr = s => {
  if (!s) return "";
  let a = s.slice();
  if (a[0] === B) a = a.slice(1); else if (a[0] === B * DL.L) a[0] = DL.L;          // B·L tokens: per sample they are just L
  if (!a.length) return "scalar";
  return a.map(v => {
    let nm = DIMS[String(v)];
    if (nm && (nm.includes("/") || (v < 8 && !/^(H|C)$/.test(nm)) || nm === "B" || nm === "B·L")) nm = null;
    if (nm === "C" && v < 8) nm = null;
    if (nm) used.add(nm);
    return st.letters && nm ? nm : v;

};

// ---------- text ----------
const ctx = document.createElement("canvas").getContext("2d");
const SANS = 'system-ui, -apple-system, "SF Pro Text", "Helvetica Neue", Inter, sans-serif', MONO = 'ui-monospace, "SF Mono", Menlo, monospace';
const tw = (s, f) => { ctx.font = f; return ctx.measureText(s).width; };
const wrap = (s, f, w, max = 2) => {
  const words = String(s || "").split(/\s+/).filter(Boolean), lines = [""];
  for (const x of words) { const t = lines[lines.length - 1] ? lines[lines.length - 1] + " " + x : x;
    if (tw(t, f) > w && lines[lines.length - 1]) { if (lines.length === max) { lines[max - 1] += "…"; break; } lines.push(x); } else lines[lines.length - 1] = t; }
  return lines.filter(Boolean);
};
const chev = (x, y) => `<path class="chev" d="M${x - 2},${y - 4} L${x + 2},${y} L${x - 2},${y + 4}"/>`;
const titleOf = n => n.t === "rep" ? `${n.label.replace(/\[.*\]$/, "")} ×${n.n}` : n.label;
function rr(pts, r = 7) {
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], [x2, y2] = pts[i + 1], d1 = Math.hypot(x1 - x0, y1 - y0), d2 = Math.hypot(x2 - x1, y2 - y1), q = Math.min(r, d1 / 2, d2 / 2);
    if (q < 0.5) { d += ` L${x1},${y1}`; continue; }
    d += ` L${x1 - (x1 - x0) / d1 * q},${y1 - (y1 - y0) / d1 * q} Q${x1},${y1} ${x1 + (x2 - x1) / d2 * q},${y1 + (y2 - y1) / d2 * q}`;
  }
  const l = pts[pts.length - 1]; return d + ` L${l[0]},${l[1]}`;
}
const defs = `<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path class="arrow" d="M0.5,1 L7.5,4 L0.5,7 z"/></marker></defs>`;
function labeler(cls) {
  const placed = [];
  return (x, y, t, anchor) => { const w = tw(t, `11px ${MONO}`) + 6, x0 = anchor === "middle" ? x - w / 2 : anchor === "end" ? x - w : x, r = [x0, y - 11, x0 + w, y + 3];
    if (placed.some(q => r[0] < q[2] && r[2] > q[0] && r[1] < q[3] && r[3] > q[1])) return ""; placed.push(r);
    return `<text class="${cls}" x="${x}" y="${y}"${anchor ? ` text-anchor="${anchor}"` : ""}>${sh(t)}</text>`; };
}

// ---------- cards ----------
// Detail on the main page: a stage card lists its sub-blocks, one level down
function subRows(n) {
  if (!st.detail || n.t !== "stage") return [];
  const its = body(n).items.map(node);
  const rows = its.filter(c => c.t === "mod" || c.t === "rep" || (c.t === "fn" && (c.semantic || st.detail)) || (c.t === "op" && c.name === "scaled_dot_product_attention"))
                  .map(c => ({ t: titleOf(c), w: c.t === "op" ? "softmax(q·kᵀ / √D_h) · v" : c.what || "" }));
  if (!rows.length) { const ops = its.filter(c => c.t === "op").map(c => c.label); if (ops.length) rows.push({ t: ops.join("  "), w: "tensor ops" }); }
  return rows;
}
const ROWH = 17;
function card(n, x, y, w, small) {
  const go = ["stage", "mod", "rep", "fn"].includes(n.t) && openable(n);
  const tf = small ? `600 13px ${SANS}` : `600 15px ${SANS}`, wf = small ? `11.5px ${SANS}` : `12px ${SANS}`;
  const lines = wrap(n.what, wf, w - 44), sub = subRows(n), hh = (small ? 40 : 46) + lines.length * 16, h = hh + (sub.length ? sub.length * ROWH + 12 : 0);
  let s = `<g class="card ${small ? "small" : ""} ${go ? "go" : ""}" data-id="${n.id}" ${go ? `data-open="${n.id}"` : ""}><rect class="c" x="${x}" y="${y}" width="${w}" height="${h}" rx="${small ? 12 : 14}"/>`;
  if (sub.length) {                                                   // tinted header strip over the sub-block list
    const r = small ? 12 : 14, yb = y + hh - 4;
    s += `<path class="hdr" d="M${x + 0.5},${yb} L${x + 0.5},${y + r} Q${x + 0.5},${y + 0.5} ${x + r},${y + 0.5} L${x + w - r},${y + 0.5} Q${x + w - 0.5},${y + 0.5} ${x + w - 0.5},${y + r} L${x + w - 0.5},${yb} Z"/>`;
    s += `<line class="sep" x1="${x}" y1="${yb}" x2="${x + w}" y2="${yb}"/><line class="spine" x1="${x + 21}" y1="${yb + 10}" x2="${x + 21}" y2="${yb + 4 + sub.length * ROWH - 6}"/>`;
    sub.forEach((r2, i) => { const ry = yb + 6 + (i + 1) * ROWH - 4, tw2 = tw(r2.t, `600 11.5px ${SANS}`);
      s += `<circle class="dot" cx="${x + 21}" cy="${ry - 4}" r="2"/><text class="rt" x="${x + 30}" y="${ry}">${esc(r2.t)}</text>`;
      const rest = wrap(r2.w, `11px ${SANS}`, w - 50 - tw2, 1)[0]; if (rest) s += `<text class="rw" x="${x + 38 + tw2}" y="${ry}">${sh(rest)}</text>`; });
  }
  s += `<text class="t" x="${x + 18}" y="${y + (small ? 24 : 28)}">${esc(titleOf(n))}</text>`;
  lines.forEach((l, i) => s += `<text class="w" x="${x + 18}" y="${y + (small ? 41 : 47) + i * 16}">${sh(l)}</text>`);
  if (n.params && tw(titleOf(n), tf) + tw(fmtN(n.params), `10.5px ${SANS}`) + 60 < w) s += `<text class="p" x="${x + w - (go ? 30 : 16)}" y="${y + (small ? 23 : 27)}" text-anchor="end">${fmtN(n.params)}</text>`;
  if (go) s += chev(x + w - 16, y + (small ? 19 : 23));
  return { svg: s + `</g>`, h };
}
const cardH = (n, w, small) => { const k = subRows(n).length; return (small ? 40 : 46) + wrap(n.what, small ? `11.5px ${SANS}` : `12px ${SANS}`, w - 44).length * 16 + (k ? k * ROWH + 12 : 0); };

// =============== main view: section columns, left -> right; one stage can be expanded in place ===============
function mainView() {
  const R = node(ROOT), secs = DATA.sections, F = st.focus, PAD = 8, VG = 30, RAILW = 156, CW = 236;
  const edges = (R.edges || []).map(e => ({ f: String(e[0]), t: String(e[1]), shape: e[2] }));
  const colOf = {}; secs.forEach((s, k) => s.items.forEach(i => colOf[String(i)] = k));
  const fcol = F ? colOf[F] : -1, mode = k => !F ? "normal" : k === fcol ? "focus" : "rail", GUT = F ? 96 : 150;
  const outs = R.items.map(String).filter(i => node(i).t === "out");
  const mainOut = outs.filter(i => /mask/i.test(node(i).label)); const mains = new Set();
  const back = i => { if (mains.has(i)) return; mains.add(i); edges.filter(e => e.t === i).forEach(e => back(e.f)); };
  (mainOut.length ? mainOut : outs.slice(0, 1)).forEach(back);
  const fsz = F ? layout(F, false, st.detail ? 700 : 820) : null;                       // the expanded stage: its sub-blocks, folded into columns if tall
  const colW = secs.map((s, k) => mode(k) === "rail" ? RAILW : mode(k) === "focus" ? Math.max(CW, fsz.w) : CW);
  const colX = k => PAD + colW.slice(0, k).reduce((a, v) => a + v + GUT, 0);
  const swf = `12.5px ${SANS}`, headLines = secs.map((s, k) => mode(k) === "rail" ? [] : wrap(s.what, swf, colW[k] + (mode(k) === "focus" ? 0 : 20), 4));
  const HEAD = 30 + Math.max(1, ...headLines.map(l => l.length)) * 17 + 26;
  const pos = {};
  const size = (i, k) => { const n = node(i), m = mode(k);
    if (m === "rail") return n.t === "in" || n.t === "out" ? { w: Math.max(tw(n.label, `500 12px ${SANS}`) + 8, 40), h: 18, io: true } : { w: RAILW - 8, h: 30, rail: true };
    if (i === F) return { w: fsz.w, h: fsz.h, frame: true, ay: 22 };
    if (n.t === "in" || n.t === "out") return { w: Math.max(tw(n.label, `600 13.5px ${SANS}`) + 8, 60), h: 34 };
    if (n.t === "latent") return { w: tw(n.label, `600 13px ${SANS}`) + tw(shapeStr(n.outs[0]), `12px ${MONO}`) + 44, h: 32 };
    const small = !mains.has(i); return { w: small ? 190 : CW, h: cardH(n, small ? 190 : CW, small), small }; };
  let bottom = 0;
  secs.forEach((s, k) => {
    const items = s.items.map(String), m = mode(k), cw = colW[k];
    const main = m === "rail" ? items.filter(i => node(i).t !== "out") : items.filter(i => mains.has(i) || node(i).t === "in"), side = m === "rail" ? [] : items.filter(i => !main.includes(i));
    const placeGroup = (list, y0) => {
      let yy = y0;
      for (let a = 0; a < list.length;) {
        const n = node(list[a]);
        if (n.t === "out" && m !== "rail") { let b = a; while (b < list.length && node(list[b]).t === "out") b++;
          const row = list.slice(a, b), ws = row.map(i => size(i, k).w), tot = ws.reduce((p, v) => p + v, 0) + 26 * (row.length - 1);
          let x = colX(k) + cw / 2 - tot / 2; row.forEach((i, j) => { pos[i] = { x, y: yy, ...size(i, k) }; x += ws[j] + 26; }); yy += 34 + VG; a = b; }
        else { const z = size(list[a], k); pos[list[a]] = { x: colX(k) + (cw - z.w) / 2, y: yy, ...z }; yy += z.h + (m === "rail" ? 22 : VG); a++; }
      }
      return yy - (m === "rail" ? 22 : VG);
    };
    const yEnd = placeGroup(main, HEAD);
    bottom = Math.max(bottom, side.length ? placeGroup(side, yEnd + 34) : yEnd);
  });
  const W = colX(secs.length - 1) + colW[secs.length - 1] + PAD + 24, H = bottom + 6;
  let svg = "";
  secs.forEach((s, k) => { const x = colX(k), on = mode(k) === "focus";
    svg += `<g class="sec"><text class="st ${on ? "on" : ""}" x="${x}" y="16">${esc(s.title)}</text>`;
    headLines[k].forEach((l, i) => svg += `<text class="sw" x="${x}" y="${38 + i * 17}">${esc(l)}</text>`);
    svg += `</g>`; });
  const put = labeler("lab"), bySrc = {}; edges.forEach(e => (bySrc[e.f] = bySrc[e.f] || []).push(e));
  let es = "", labs = "";
  for (const e of edges) {
    const a = pos[e.f], b = pos[e.t]; if (!a || !b) continue;
    const src = node(e.f), tgt = node(e.t), so = src.outs && src.outs.find(o => o.reduce((p, v) => p * v, 1) === e.shape.reduce((p, v) => p * v, 1));
    const txt = shapeStr(so && so[0] === B ? so : e.shape);
    const quiet = src.t === "latent" || tgt.t === "latent" || a.io || b.io || (a.rail && b.rail);
    const sib = bySrc[e.f];
    if (colOf[e.f] === colOf[e.t]) {
      const sx = a.x + a.w / 2, sy = a.y + a.h, tx = b.x + b.w / 2, ty = b.y;
      if (b.y < a.y) continue;
      const d = Math.abs(sx - tx) < 1 ? `M${sx},${sy} L${tx},${ty}` : rr([[sx, sy], [sx, sy + (ty - sy) / 2], [tx, sy + (ty - sy) / 2], [tx, ty]]);
      es += `<path class="edge" d="${d}" marker-end="url(#ah)"/>`;
      const sameFan = sib.every(o => JSON.stringify(o.shape) === JSON.stringify(e.shape));
      if (!quiet && !(a.rail || b.rail) && (!sameFan || sib[0] === e)) labs += Math.abs(sx - tx) < 1 ? put(sx + 8, (sy + ty) / 2 + 4, txt) : sameFan ? put(sx + 8, sy + 12, txt) : put(tx + 6, sy + (ty - sy) / 2 - 4, txt);
    } else {                                                          // across columns: right side -> left side (a frame connects at its header)
      const sx = a.x + a.w, sy = a.y + (a.ay ?? a.h / 2), tx = b.x, ty = b.y + (b.ay ?? b.h / 2);
      const lw = tw(txt, `11px ${MONO}`);
      if (Math.abs(sy - ty) < 1) { es += `<path class="edge" d="M${sx},${sy} L${tx},${ty}" marker-end="url(#ah)"/>`; if (!quiet && lw < tx - sx - 12) labs += put((sx + tx) / 2, sy - 8, txt, "middle"); }
      else { const gx = b.x - 18; es += `<path class="edge" d="${rr([[sx, sy], [gx, sy], [gx, ty], [tx, ty]], 9)}" marker-end="url(#ah)"/>`; if (!quiet && lw < gx - sx - 12) labs += put((sx + gx) / 2, sy - 8, txt, "middle"); }
    }
  }
  let ns = "";
  for (const i in pos) { const n = node(i), p = pos[i];
    if (p.frame) ns += nodeSvg(i, p.x, p.y, false);

    else if (p.rail) ns += `<g class="rail" data-id="${i}" data-focus="${i}"><rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="${n.t === "latent" ? p.h / 2 : 8}"/><text x="${p.x + 12}" y="${p.y + 19}">${esc(wrap(titleOf(n), `500 12px ${SANS}`, p.w - 20, 1)[0])}</text></g>`;

// =============== page ===============
const DESC = { L: "lasers", F: "frequency bins", C: "channels", n_bands: "frequency bands", BINS: "bins per band", "BINS·C": "values in one band (bins × channels)", D: "hidden dim",

  <div class="seg" role="group" aria-label="Level of detail"><button id="b-stages" aria-pressed="true">Stages</button><button id="b-detail" aria-pressed="false">Detail</button></div></div>`;
