<style>

<body>
<div id="top"></div>
<div id="wrap"><canvas id="c"></canvas><div id="title"></div><div id="leg"></div><div id="tip"></div><div id="busy">computing…</div></div>
<script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">

}
function lockAxes() { $('x').disabled = $('y').disabled = $('best').value != 'none'; $('z').title = $('best').value != 'none' ? 'none = best 2-D pair, a number = best 3' : ''; }
function setOpts(k, opts) { const s = $(k), v = s.value; s.innerHTML = opts.map(o => `<option>${o}</option>`).join(''); s.value = opts.includes(v) ? v : (DEF[k] && opts.includes(DEF[k]) ? DEF[k] : opts[0]); }
if ($('method').value == 'umap') for (const a of ['x', 'y', 'z']) setOpts(a, a == 'z' ? ['none', ...PCS(3)] : PCS(3));
lockAxes();
// ---- display picker: searchable checklist of every split (unticked → not drawn; the fit is unaffected). Default = DISPLAY_OFF entries unticked.
const DEF_ON = () => META.splits.filter(s => s[2]).map(s => s[0]);
const display = new Set(saved.display !== undefined ? saved.display.split(',').filter(x => x) : DEF_ON());
const disp = document.createElement('span'); disp.id = 'disp';
disp.innerHTML = `<button></button><div id="dpanel"><input type="text" placeholder="search splits… (Enter = tick matches only)">
  <div><button data-a="1">tick shown</button> <button data-a="0">untick shown</button> <button data-a="d">defaults</button></div><div id="dlist"></div></div>`;
$('top').append(disp);
const dbtn = disp.firstChild, dp = disp.querySelector('#dpanel'), dq = dp.querySelector('input'), dl = dp.querySelector('#dlist');
dl.innerHTML = META.splits.map(([s, n]) => `<label><input type="checkbox" value="${s}"> ${s} <span class="n">${n}</span></label>`).join('');
const boxes = [...dl.querySelectorAll('input')];
let dt = 0; const dirty = () => { clearTimeout(dt); dt = setTimeout(load, 400); };  // debounce: ticking several boxes → one request
function dsync() { boxes.forEach(b => b.checked = display.has(b.value)); dbtn.textContent = `display ${display.size}/${boxes.length} splits ▾`; }
function dfilter() { const q = dq.value.toLowerCase().split(/\s+/).filter(x => x); boxes.forEach(b => b.parentNode.style.display = q.every(w => b.value.toLowerCase().includes(w)) ? '' : 'none'); }
const vis = () => boxes.filter(b => b.parentNode.style.display != 'none');
boxes.forEach(b => b.onchange = () => { b.checked ? display.add(b.value) : display.delete(b.value); dsync(); dirty(); });
dp.querySelectorAll('button').forEach(b => b.onclick = () => {
  if (b.dataset.a == 'd') { display.clear(); DEF_ON().forEach(s => display.add(s)); }
  else vis().forEach(x => b.dataset.a == '1' ? display.add(x.value) : display.delete(x.value));
  dsync(); dirty(); });
dq.oninput = dfilter;
dq.onkeydown = e => { if (e.key == 'Enter') { const v = new Set(vis().map(b => b.value)); display.clear(); v.forEach(x => display.add(x)); dsync(); dirty(); }
                      if (e.key == 'Escape') dp.style.display = 'none'; };
dbtn.onclick = () => { const o = dp.style.display != 'block'; dp.style.display = o ? 'block' : 'none'; if (o) dq.focus(); };
addEventListener('mousedown', e => { if (!disp.contains(e.target)) dp.style.display = 'none'; });
dsync();
const sl = document.createElement('input'); sl.type = 'range'; sl.min = 4; sl.max = 100; sl.value = saved.img ?? 28;
const sz = document.createElement('label'); sz.append('image size ', sl); $('top').append(sz);
// density: show the first p% of a farthest-point order (evenly spread, nested, deterministic); the slider only changes draw ranges
const dn = document.createElement('input'); dn.type = 'range'; dn.min = 0; dn.max = 100; dn.value = saved.density ?? 100;
const dnN = document.createElement('span'); dnN.style.color = '#777';
const dnl = document.createElement('label'); dnl.append('density ', dn, ' ', dnN); $('top').append(dnl);
dn.oninput = () => { density(); hash(); render(); };
const save = document.createElement('button'); save.textContent = 'save SVG'; save.title = 'download the current view (this exact camera) as a cropped SVG'; save.onclick = async () => { save.disabled = true; save.textContent = 'saving…'; await new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));  // let the label paint first

let ctl = null;
let D = null, d3 = null, root = new THREE.Group(), pts = [], walls = [], labels = [];

const HOME = {true: [3.6, -4.2, 2.6], false: [0, 0, 5.4]};

cv.ondblclick = home;
function resize() { const w = innerWidth, h = Math.max(400, innerHeight - $('top').offsetHeight - (parseFloat($('wrap').style.paddingTop) || 0) - 8);

addEventListener('resize', resize);

  c.width = Math.ceil(h.measureText(s).width) + 8; c.height = px * 1.3;
  h.font = px + 'px sans-serif'; h.fillStyle = col; h.textBaseline = 'middle'; h.fillText(s, 4, c.height / 2);

const S = () => sl.value / 130;  // world size of an image
sl.oninput = () => { pts.forEach(o => o.material.size = S() * o.userData.sc); hash(); render(); };

  pts = Object.values(groups).map(g => {
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(g.idx.flatMap(n => P[n].slice(0, 3)), 3));
    const o = new THREE.Points(geo, new THREE.PointsMaterial({size: S() * g.sc, map: texture(g.i, g.col), alphaTest: .5, sizeAttenuation: true}));
    o.userData.idx = g.idx; o.userData.sc = g.sc; root.add(o); return o;
  });

  const TK = d3 ? D.ticks : [...D.ticks, []];

    const grp = new THREE.Group(), a = (j + 1) % 3, b = (j + 2) % 3, v = (x, y) => { const q = [0, 0, 0]; q[a] = x; q[b] = y; return q; };
    const pl = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({color: 0xe5ecf6, side: THREE.DoubleSide, depthWrite: false}));

    ticks: TK[j].map(t => { const s = text(t[1]); root.add(s); return [t[0], s]; }),

}

  labels.forEach((l, j) => {

      if (j < 2) { const o = 1 - j; q[o] = sg[o] * off; q[2] = d3 ? -1 : 0; } else { q[0] = sg[0] * off; q[1] = -sg[1]; } return q; };

}

  if (!D) return; const N = D.pts.length, k = Math.round(dn.value / 100 * N);

let seq = 0;

  const r = await (await fetch('/api/plot?' + q)).json();

// ---- figure layout, shared by the live view (layout) and the SVG (saveSvg): project the scene through the current camera, crop to the

const mctx = document.createElement('canvas').getContext('2d'), tw = (s, px, bold) => { mctx.font = `${bold ? 'bold ' : ''}${px}px sans-serif`; return mctx.measureText(s).width; };  // text width (same font as the SVG)

           leg.push(`<text x="${r1(cx + 14)}" y="${y}" font-size="10" fill="#222" dominant-baseline="central">${esc(r[1])}</text>`); } }); cx += cw[j]; });
  const TH = Math.max(top + ph, top + Math.min(rows.length, per) * LH);

<defs>${Object.values(defs).join('')}</defs>
<rect width="100%" height="100%" fill="#fff"/>
${tl.map((t, i) => `<text x="0" y="${r1((i + .5) * TF * 1.25)}" font-size="${TF}" fill="#555" dominant-baseline="central">${esc(t)}</text>`).join('\n')}
