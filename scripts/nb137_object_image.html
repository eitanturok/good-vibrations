<!doctype html>
<!-- page for scripts/nb137_object_image.py (served at /; data from /api/meta + /api/plot). three.js scatter of object images, plotly-style walls / grid / ticks. -->
<html><head><meta charset="utf-8"><title>nb137 object images</title>
<style>
  body { margin: 0; font: 12px sans-serif; background: #fff; color: #222 }
  #top { padding: 6px 10px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center }
  #top label { white-space: nowrap } #top select { font: inherit }
  #title { padding: 0 10px; color: #555 } #leg { padding: 4px 10px } #leg span { margin-right: 10px }
  #wrap { position: relative } canvas { display: block }
  #tip { position: absolute; pointer-events: none; background: #fffe; border: 1px solid #999; padding: 2px 5px; display: none; white-space: nowrap }
  #busy { position: absolute; left: 50%; top: 40%; transform: translate(-50%); background: #fffd; padding: 8px 14px; border: 1px solid #ccc; display: none }
</style></head>
<body>
<div id="top"></div>
<div id="title"></div>
<div id="wrap"><canvas id="c"></canvas><div id="tip"></div><div id="busy">computing…</div></div>
<div id="leg"></div>
<script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $ = id => document.getElementById(id), cv = $('c'), tip = $('tip');
const META = await (await fetch('/api/meta')).json();

// ---- controls (state kept in the URL hash, so reload / share keeps the view settings)
const PCS = n => [...Array(n)].map((_, i) => String(i + 1));
const CTL = {box: META.box, speaker: META.speaker, object: META.object, data: META.data, method: META.method, colour: META.colour, size: META.size,
             best: META.best, x: PCS(10), y: PCS(10), z: ['none', ...PCS(10)]};
const DEF = {x: '1', y: '2', z: '3'}, saved = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
for (const [k, opts] of Object.entries(CTL)) {
  const l = document.createElement('label'), s = document.createElement('select'); s.id = k;
  s.innerHTML = opts.map(o => `<option>${o}</option>`).join(''); s.value = saved[k] ?? DEF[k] ?? opts[0];
  s.onchange = () => { if (k == 'best') lockAxes(); if (k == 'method') { const n = s.value == 'umap' ? 3 : 10; for (const a of ['x', 'y', 'z']) setOpts(a, a == 'z' ? ['none', ...PCS(n)] : PCS(n)); } load(); };
  l.append(k + ' ', s); $('top').append(l);
}
function lockAxes() { $('x').disabled = $('y').disabled = $('best').value != 'none'; $('z').title = $('best').value != 'none' ? 'none = best 2-D pair, a number = best 3' : ''; }
function setOpts(k, opts) { const s = $(k), v = s.value; s.innerHTML = opts.map(o => `<option>${o}</option>`).join(''); s.value = opts.includes(v) ? v : (DEF[k] && opts.includes(DEF[k]) ? DEF[k] : opts[0]); }
if ($('method').value == 'umap') for (const a of ['x', 'y', 'z']) setOpts(a, a == 'z' ? ['none', ...PCS(3)] : PCS(3));
lockAxes();
const sl = document.createElement('input'); sl.type = 'range'; sl.min = 4; sl.max = 100; sl.value = saved.img ?? 28;
const sz = document.createElement('label'); sz.append('image size ', sl); $('top').append(sz);
const help = document.createElement('span'); help.style.color = '#777'; $('top').append(help);

// ---- three.js scene (rebuilt per plot; camera kept unless 2-D ↔ 3-D changes)
const R = new THREE.WebGLRenderer({canvas: cv, antialias: true}); R.setPixelRatio(devicePixelRatio); R.setClearColor(0xffffff);
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(30, 1, .01, 100);
let ctl = null;
let D = null, d3 = null, root = new THREE.Group(), pts = [], walls = [], labels = [];
scene.add(root);
const HOME = {true: [3.6, -4.2, 2.6], false: [0, 0, 5.4]};
function home() {  // OrbitControls fixes its orbit axis from cam.up at construction → rebuild it whenever up changes (turntable around the vertical axis, like plotly)
  cam.up.set(...(d3 ? [0, 0, 1] : [0, 1, 0])); cam.position.set(...HOME[d3]);
  if (ctl) ctl.dispose();
  ctl = new OrbitControls(cam, cv); ctl.addEventListener('change', render); ctl.zoomSpeed = 1.5;
  ctl.enableRotate = d3; ctl.mouseButtons.LEFT = d3 ? THREE.MOUSE.ROTATE : THREE.MOUSE.PAN;
  ctl.target.set(0, 0, 0); ctl.update(); render();
}
cv.ondblclick = home;
function resize() { const w = innerWidth, h = Math.max(400, innerHeight - $('top').offsetHeight - $('title').offsetHeight - $('leg').offsetHeight - 8);
  R.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix(); render(); }
addEventListener('resize', resize);

const load1 = u => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = u; });
const im = await Promise.all(META.sprites.map(s => s ? Promise.all(s.map(load1)) : null));
const texCache = {};
function texture(i, col) {  // object picture with its contour ring tinted in the point colour (cached per object × colour)
  const key = i + col; if (texCache[key]) return texCache[key];
  const s = document.createElement('canvas'); s.width = s.height = 64; const h = s.getContext('2d');
  if (im[i]) { h.drawImage(im[i][1], 0, 0); h.globalCompositeOperation = 'source-in'; h.fillStyle = col; h.fillRect(0, 0, 64, 64);
               h.globalCompositeOperation = 'source-over'; h.drawImage(im[i][0], 0, 0); }
  else { h.strokeStyle = col; h.lineWidth = 8; h.beginPath(); h.moveTo(14, 14); h.lineTo(50, 50); h.moveTo(50, 14); h.lineTo(14, 50); h.stroke(); }
  const t = new THREE.CanvasTexture(s); t.colorSpace = THREE.SRGBColorSpace; return texCache[key] = t;
}
function text(s, px = 32, col = '#444') {
  const c = document.createElement('canvas'), h = c.getContext('2d'); h.font = px + 'px sans-serif';
  c.width = Math.ceil(h.measureText(s).width) + 8; c.height = px * 1.3;
  h.font = px + 'px sans-serif'; h.fillStyle = col; h.textBaseline = 'middle'; h.fillText(s, 4, c.height / 2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map: t, depthTest: false})); sp.scale.set(c.width / c.height * .09 * px / 40, .09 * px / 40, 1); return sp;
}
const S = () => sl.value / 130;  // world size of an image
sl.oninput = () => { pts.forEach(o => o.material.size = S() * o.userData.sc); hash(); render(); };

function build() {
  root.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material && o.material.map && !Object.values(texCache).includes(o.material.map)) o.material.map.dispose(); });
  scene.remove(root); root = new THREE.Group(); scene.add(root);
  const P = D.pts, groups = {};
  P.forEach((p, n) => { const k = p[3] + '|' + p[4] + '|' + p[6]; (groups[k] ??= {i: p[3], col: p[4], sc: p[6], idx: []}).idx.push(n); });  // one draw call per object × colour × size
  pts = Object.values(groups).map(g => {
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(g.idx.flatMap(n => P[n].slice(0, 3)), 3));
    const o = new THREE.Points(geo, new THREE.PointsMaterial({size: S() * g.sc, map: texture(g.i, g.col), alphaTest: .5, sizeAttenuation: true}));
    o.userData.idx = g.idx; o.userData.sc = g.sc; root.add(o); return o;
  });
  // plotly-style axes: grey walls with white grid lines at the ticks; walls sit on the far side of the camera
  const TK = d3 ? D.ticks : [...D.ticks, []];
  walls = [0, 1, 2].map(j => {
    const grp = new THREE.Group(), a = (j + 1) % 3, b = (j + 2) % 3, v = (x, y) => { const q = [0, 0, 0]; q[a] = x; q[b] = y; return q; };
    const pl = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({color: 0xe5ecf6, side: THREE.DoubleSide, depthWrite: false}));
    pl.lookAt(...[0, 1, 2].map(q => q == j ? 1 : 0)); grp.add(pl);
    const L = []; TK[a].forEach(t => L.push(...v(t[0], -1), ...v(t[0], 1))); TK[b].forEach(t => L.push(...v(-1, t[0]), ...v(1, t[0])));
    const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(L, 3));
    grp.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial({color: 0xffffff})));
    grp.visible = d3 || j == 2; root.add(grp); return grp;
  });
  labels = D.axes.map((name, j) => ({
    ticks: TK[j].map(t => { const s = text(t[1]); root.add(s); return [t[0], s]; }),
    title: (() => { const s = text(name, 40, '#222'); root.add(s); return s; })(),
  }));
}
function render() {
  if (!D) return R.render(scene, cam);
  const c = cam.position.clone().sub(ctl ? ctl.target : new THREE.Vector3()), sg = [0, 1, 2].map(j => Math.sign(c.getComponent(j)) || 1);
  if (!d3) { sg[0] = sg[1] = -1; sg[2] = 1; }  // 2-D: x labels below, y labels left
  walls.forEach((w, j) => { const q = [0, 0, 0]; q[j] = -sg[j] * (d3 ? 1 : .01); w.position.set(...q); });
  labels.forEach((l, j) => {
    const pos = (t, off) => { const q = [0, 0, 0]; q[j] = t;
      if (j < 2) { const o = 1 - j; q[o] = sg[o] * off; q[2] = d3 ? -1 : 0; } else { q[0] = sg[0] * off; q[1] = -sg[1]; } return q; };
    l.ticks.forEach(([t, s]) => s.position.set(...pos(t, 1.12)));
    const tp = pos(0, d3 ? 1.4 : 1.25); if (j == 2) tp[2] = 0; l.title.position.set(...tp);
  });
  R.render(scene, cam);
}
function hash() { const p = Object.fromEntries(Object.keys(CTL).map(k => [k, $(k).value])); p.img = sl.value; history.replaceState(null, '', '#' + new URLSearchParams(p)); }

let seq = 0;
async function load() {
  hash(); const my = ++seq; $('busy').style.display = 'block';
  const q = new URLSearchParams(Object.fromEntries(Object.keys(CTL).map(k => [k, $(k).value])));
  const r = await (await fetch('/api/plot?' + q)).json();
  if (my != seq) return;  // a newer request superseded this one
  $('busy').style.display = 'none';
  if (r.error) { $('title').textContent = '⚠ ' + r.error; return; }
  const was = d3; D = r; d3 = r.d3; build();
  if ($('best').value != 'none') { $('x').value = r.picked[0]; $('y').value = r.picked[1]; if (r.picked[2]) $('z').value = r.picked[2]; hash(); }  // show the chosen components
  $('title').textContent = r.title + ` · ${META.ckpt}`;
  $('leg').innerHTML = (Object.keys(r.legend).length ? 'colour: ' : '') + Object.entries(r.legend).map(([k, c]) => `<span><b style="color:${c}">■</b> ${k}</span>`).join('')
    + (Object.keys(r.size_legend).length ? ' &nbsp; size: ' + Object.entries(r.size_legend).map(([k, f]) => `<span><b style="font-size:${16 * f}px">●</b> ${k}</span>`).join('') : '');
  help.textContent = d3 ? 'drag = rotate, right-drag / shift-drag = pan, scroll = zoom, double-click = reset' : 'drag = pan, scroll = zoom, double-click = reset';
  if (was !== d3) home();
  resize();
}
// hover: nearest image under the cursor
const ray = new THREE.Raycaster(), m = new THREE.Vector2(); let raf = 0;
cv.onmousemove = e => { if (raf || !D) return; raf = requestAnimationFrame(() => { raf = 0;
  m.set(e.offsetX / cv.clientWidth * 2 - 1, -e.offsetY / cv.clientHeight * 2 + 1); ray.params.Points.threshold = S() * .35; ray.setFromCamera(m, cam);
  const h = ray.intersectObjects(pts)[0];
  if (h) { tip.style.display = 'block'; tip.style.left = (e.offsetX + 12) + 'px'; tip.style.top = (e.offsetY + 12) + 'px'; tip.innerHTML = D.pts[h.object.userData.idx[h.index]][5]; }
  else tip.style.display = 'none'; }); };
cv.onmouseleave = () => tip.style.display = 'none';
load();
</script>
</body></html>
