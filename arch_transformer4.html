  const cnt = route();
  if (cnt.some(c => c) && folded) { allow = cnt.map(c => c ? LANE * c + 6 : 0); route(); }
  if (String(id) === String(st.focus)) {                              // the expanded stage: wide enough for its header line, contents centred
    const minW = tw(titleOf(n), `600 14px ${SANS}`) + (n.what ? tw(n.what, `12px ${SANS}`) : 0) + 240;
    if (W < minW) { const dx = (minW - W) / 2; for (const c in pos) pos[c].x += dx;
      for (const g of geo) { for (const k of ["sx", "tx", "lx", "txR"]) if (g[k] !== undefined) g[k] += dx; if (g.pts) g.pts = g.pts.map(([a, b2]) => [a + dx, b2]); }
      W = minW; }
  }
  n._L = { pos, geo, W, H };
  return { w: W, h: H };
}
function edgesSvg(n, ox, oy, cls) {
  let s = "", labs = ""; const put = labeler(cls), bySrc = {};
  for (const g of n._L.geo) (bySrc[g.e.f] = bySrc[g.e.f] || []).push(g);
  for (const g of n._L.geo) {
    const sx = g.sx + ox, sy = g.sy + oy, tx = g.tx + ox, ty = g.ty + oy; let d;
    if (g.pts) { s += `<path class="edge" d="${rr(g.pts.map(([a, b2]) => [a + ox, b2 + oy]))}" marker-end="url(#ah)"/>`; continue; }
    if (g.side) d = `M${sx},${sy} L${tx},${ty}`;
    else if (g.long) { const lx = g.lx + ox;                          // residual / skip: out along a lane, into the target's right side
      d = g.tyMid !== undefined ? rr([[sx, sy], [sx, sy + 12], [lx, sy + 12], [lx, g.tyMid + oy], [g.txR + ox, g.tyMid + oy]]) : rr([[sx, sy], [sx, sy + 12], [lx, sy + 12], [lx, ty - 12], [tx, ty - 12], [tx, ty]]); }
    else if (Math.abs(sx - tx) < 1) d = `M${sx},${sy} L${tx},${ty}`;
    else { const my = g.rb + oy + Math.round((ty - g.rb - oy) / 2); d = rr([[sx, sy], [sx, my], [tx, my], [tx, ty]]); }
    s += `<path class="edge" d="${d}" marker-end="url(#ah)"/>`;
    const src = node(g.e.f);
    if ((src && src.t === "param") || g.e.f === "IN" || g.e.t === "OUT" || g.long) continue;
    const sib = bySrc[g.e.f], same = sib.every(o => JSON.stringify(o.e.shape) === JSON.stringify(g.e.shape));
    if (same && sib.length > 1 && sib[0] !== g) continue;
    const txt = shapeStr(g.e.shape);
    labs += Math.abs(sx - tx) < 1 ? put(tx + 8, (sy + ty) / 2 + 4, txt) : put(tx + 8, ty - 8, txt);
  }
  return s + labs;
}
function nodeSvg(id, x, y, isRoot) {
  const n = node(id);
  if (n._L) {
    const { pos, W, H } = n._L; let s = "";
    if (!isRoot) {
      const isF = String(id) === String(st.focus);
      s += `<g class="frame ${isF ? "focus" : ""}" data-id="${id}"><rect class="f" x="${x}" y="${y}" width="${W}" height="${H}" rx="14"/>`;
      s += `<path class="hd" d="M${x},${y + HEAD - 6} L${x},${y + 14} Q${x},${y} ${x + 14},${y} L${x + W - 14},${y} Q${x + W},${y} ${x + W},${y + 14} L${x + W},${y + HEAD - 6} Z"/>`;
      s += `<g class="fh" ${isF ? "data-unfocus=\"1\"" : `data-toggle="${id}"`}><rect x="${x}" y="${y}" width="${W}" height="${HEAD - 6}" fill="transparent"/><path class="chev" d="M${x + 14},${y + 18} L${x + 18},${y + 22} L${x + 22},${y + 18}"/>`;
      if (isF) s += `<text class="back" x="${x + W - 14}" y="${y + 25}" text-anchor="end">‹ back to overview</text>`;
      s += `<text class="t" x="${x + 30}" y="${y + 25}">${esc(titleOf(n))}</text>`;
      const tW = tw(titleOf(n), `600 14px ${SANS}`);
      if (n.what) s += `<text class="w" x="${x + 40 + tW}" y="${y + 25}">${esc(wrap(n.what, `12px ${SANS}`, W - tW - (isF ? 190 : 60), 1)[0] || "")}</text>`;
      s += `</g></g>`;
    }
    s += edgesSvg(n, x, y, isRoot ? "lab" : "lab inf");
    for (const c in pos) s += nodeSvg(c, x + pos[c].x, y + pos[c].y, false);
    return s;
  }
  const { w, h } = leafSize(n);
  if (n.t === "op") return n.sym || n.label.length < 2
    ? `<g class="op" data-id="${id}"><circle cx="${x + 13}" cy="${y + 13}" r="12.5"/><text class="sym" x="${x + 13}" y="${y + 18}" text-anchor="middle">${esc(n.label)}</text></g>`
    : `<g class="op" data-id="${id}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="13"/><text x="${x + w / 2}" y="${y + 17}" text-anchor="middle">${esc(n.label)}</text></g>`;
  if (n.t === "param") return `<g class="par" data-id="${id}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6"/><text x="${x + 9}" y="${y + 16}">${esc(n.label)}  ${sh(shapeStr(n.outs[0]))}</text></g>`;
  if (n.t === "in" || n.t === "out" || n.t === "latent") return `<g class="io" data-id="${id}"><text class="w" x="${x + w / 2}" y="${y + 10}" text-anchor="middle">${n.t === "in" ? "INPUT" : n.t === "out" ? "OUTPUT" : "LATENT"}</text><text class="t" x="${x + w / 2}" y="${y + 28}" text-anchor="middle">${esc(n.label)}</text></g>`;
  const c = card(n, x, y, w, true); return c.svg.replace(`data-open="${id}"`, n.t === "stage" ? `data-focus="${id}"` : `data-toggle="${id}"`);
}
function layered(id, isRoot) {
  const { w, h } = layout(id, isRoot);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 ${w + 4} ${h + 4}" width="${w + 4}" height="${h + 4}">${defs}${nodeSvg(id, 0, 0, isRoot)}</svg>`;
}

// =============== page ===============
const DESC = { L: "lasers", F: "frequency bins", C: "channels", n_bands: "frequency bands", BINS: "bins per band", "BINS·C": "values in one band (bins × channels)", D: "hidden dim",
  D_l: "latent dim", H: "attention heads", "L+n_bands": "laser mask + band mask", D_h: "head dim (D / H)", mask_h: "mask height", mask_w: "mask width", n_queries: "queries" };
const ORDER = ["L", "F", "C", "n_bands", "BINS", "BINS·C", "D", "H", "D_h", "D_l", "L+n_bands"];
function draw() {
  used.clear();
  const stack = innerWidth < 900;
  document.body.classList.toggle("stack", stack);
  $("#canvas").innerHTML = stack ? layered(ROOT, true) : mainView();
  for (const k of ["H", "D_h"]) if (DL[k] !== undefined) used.add(k);
  const names = [...used].sort((a, b2) => (ORDER.indexOf(a) + 1 || 99) - (ORDER.indexOf(b2) + 1 || 99));
  const hs = t => esc(t).replace(/\b([A-Z])_([a-z])\b/g, "$1<sub>$2</sub>");
  $("#foot").innerHTML = names.map(k => hs(`${k} = ${DL[k] ?? ""} ${DESC[k] || ""}`.trim())).join("&nbsp;&nbsp;·&nbsp;&nbsp;");
  $("#back").style.display = st.focus ? "" : "none";
}
// depth of an expanded stage: Stages = one level (no tensor ops), Detail = everything, ops included
function openAll(id) { for (const c of kids(node(id))) if (openable(node(c)) && node(c).t !== "fn") { st.open[c] = true; openAll(c); } }   // helper fns stay cards (click to open)
const focus = id => { st.focus = id; st.open = {}; if (id) { st.open[id] = true; if (st.detail) openAll(id); } draw(); };
$("#hdr").innerHTML = `<div><h1>${esc(M.cls)}</h1><div class="meta">${fmtN(M.params)} parameters · ${esc(M.arch)}<button id="back">‹ back to overview</button></div></div>
  <div class="ctl"><div class="seg" role="group" aria-label="Shape labels"><button id="b-let" aria-pressed="true">L × D</button><button id="b-num" aria-pressed="false">100 × ${DL.D ?? 256}</button></div>
  <div class="seg" role="group" aria-label="Level of detail"><button id="b-stages" aria-pressed="true">Stages</button><button id="b-detail" aria-pressed="false">Detail</button></div></div>`;
const press = (a, b2, on) => { $(a).setAttribute("aria-pressed", on); $(b2).setAttribute("aria-pressed", !on); };
$("#b-let").onclick = () => { st.letters = true; press("#b-let", "#b-num", true); draw(); };
$("#b-num").onclick = () => { st.letters = false; press("#b-let", "#b-num", false); draw(); };
const setDetail = on => { st.detail = on; press("#b-stages", "#b-detail", !on); focus(st.focus); };   // overview cards list sub-blocks; an expanded stage opens fully
$("#b-stages").onclick = () => setDetail(false);
$("#b-detail").onclick = () => setDetail(true);
$("#back").onclick = () => focus(null);
document.addEventListener("click", ev => {
  if (ev.target.closest("[data-unfocus]")) { focus(null); return; }
  const f = ev.target.closest("[data-focus]");
  if (f) { if (document.body.classList.contains("stack")) { st.open[f.dataset.focus] = !st.open[f.dataset.focus]; draw(); } else focus(f.dataset.focus === st.focus ? null : f.dataset.focus); return; }
  const t = ev.target.closest("#canvas [data-toggle]"); if (t) { st.open[t.dataset.toggle] = !st.open[t.dataset.toggle]; draw(); }
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && st.focus) focus(null); });
addEventListener("resize", () => draw());

const tip = $("#tip");
document.addEventListener("mousemove", ev => {
  const g = ev.target.closest("[data-id]"); if (!g) { tip.style.display = "none"; return; }
  const n = node(g.dataset.id); let h = `<b>${esc(titleOf(n))}</b>`;
  if (n.what && !["stage", "latent"].includes(n.t)) h += `<div>${esc(n.what)}</div>`;
  if (n.params) h += `<div>${n.params.toLocaleString()} parameters${n.pct ? ` · ${n.pct.toFixed(1)}% of the model` : ""}</div>`;
  if (n.mod) h += `<div><code>${esc(n.mod)}</code>${n.cls ? " · " + esc(n.cls) : ""}</div>`;
  if (n.t === "op" && n.detail) h += `<div><code>${esc(n.name)}(${esc(n.detail)})</code></div>`;
  if (n.outs && n.outs.length) h += `<div>out <code>${esc(shapeStr(n.outs[0]))}</code></div>`;
  if (n.t === "latent" && n.returned) h += `<div>also returned as out["${esc(n.label)}"]</div>`;
  tip.innerHTML = h; tip.style.display = "block";
  const r = tip.getBoundingClientRect(); let tx = ev.clientX + 16, ty = ev.clientY + 16;
  if (tx + r.width > innerWidth - 8) tx = ev.clientX - r.width - 16; if (ty + r.height > innerHeight - 8) ty = innerHeight - r.height - 8;
  tip.style.left = tx + "px"; tip.style.top = ty + "px";
});
draw();
})();
</script>
