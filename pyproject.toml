[project]
name = "good-vibrations"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "composer>=0.32.1",
    "datasets>=4.7.0",
    "einops>=0.8.2",
    "icecream>=2.1.10",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "modal>=1.3.5",
    "mosaicml>=0.32.1",
    "opencv-python>=4.11.0.86",
    "safetensors>=0.7.0",
    "sam3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "setuptools<82",
    "torch==2.7.0",
    "triton>=3.3.0; sys_platform == 'linux'",
    "torchaudio>=2.7.0",
    "torchvision>=0.22.0",
    "wandb>=0.25.1",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
    "decord>=0.6.0",
    "pycocotools>=2.0.11",
]

[project.optional-dependencies]
lab = [
    "cupy-cuda12x>=13.6.0; sys_platform == 'win32'",
    "pyueye>=4.96.952; sys_platform == 'win32'",
    "sounddevice>=0.5.5; sys_platform == 'win32'",
    "soundfile>=0.13.1; sys_platform == 'win32'",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu126"
default = true

[tool.uv.sources]
sam3 = { git = "https://github.com/facebookresearch/sam3" }
