<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>viz2 — mask comparison</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<aside id="sidebar">
  <header class="brand">
    <h1>viz2</h1>
    <p id="subtitle">loading…</p>
  </header>

  <section class="panel">
    <h2>Display</h2>
    <div class="seg" id="mode-seg">
      <button data-mode="pred" class="on">Prediction</button>
      <button data-mode="diff">Difference</button>
    </div>
    <div id="legend"></div>
    <label class="check"><input type="checkbox" id="bg-toggle" checked><span>Show background</span></label>
  </section>

  <section class="panel">
    <div class="phead"><h2>Position</h2><button class="link" id="pos-clear">clear</button></div>
    <p class="hint">Drag to lasso · click a point · arrow keys to walk</p>
    <svg id="scatter" tabindex="0"></svg>
    <p class="hint" id="pos-status">all positions</p>
  </section>

  <section class="panel">
    <div class="phead"><h2>Speaker</h2><span class="count" id="spk-count"></span></div>
    <svg id="speakers"></svg>
    <div class="links"><button class="link" data-all="speakers">all</button><button class="link" data-none="speakers">none</button></div>
  </section>

  <section class="panel">
    <div class="phead"><h2>Split</h2><span class="count" id="split-count"></span></div>
    <div class="chips" id="split-chips"></div>
    <div class="links"><button class="link" data-all="splits">all</button><button class="link" data-none="splits">none</button></div>
  </section>

  <section class="panel">
    <div class="phead"><h2>Layout</h2><span class="count" id="layout-count"></span></div>
    <div class="chips" id="layout-chips"></div>
    <div class="links"><button class="link" data-all="layouts">all</button><button class="link" data-none="layouts">none</button></div>
  </section>

  <section class="panel">
    <div class="phead"><h2>Objects</h2><span class="count" id="nobj-count"></span></div>
    <div class="chips" id="nobj-chips"></div>
    <div class="links"><button class="link" data-all="nObjects">all</button><button class="link" data-none="nObjects">none</button></div>
  </section>

  <section class="panel">
    <div class="phead"><h2>Metrics</h2><button class="link" id="metric-reset">reset</button></div>
    <p class="hint" id="metric-scope">across all loaded runs</p>
    <div id="sliders"></div>
  </section>
</aside>

<main>
  <div id="toolbar">
    <div id="runbar"></div>
    <div class="grow"></div>
    <span id="rowcount" class="count"></span>
    <button id="add-run" class="btn">+ Add run</button>
  </div>
  <div id="scroller"><div id="spacer"></div><div id="rows"></div></div>
  <div id="empty" hidden>No samples match these filters.</div>
</main>

<div id="tooltip" hidden></div>

<div id="runpicker" class="overlay" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <h2>Add a run</h2>
      <button class="x" data-close>&times;</button>
    </div>
    <input id="run-search" type="search" placeholder="Filter runs…" autocomplete="off">
    <div id="run-list"></div>
  </div>
</div>

<div id="modal" class="overlay" hidden>
  <div class="sheet wide">
    <div class="sheet-head">
      <h2 id="m-title"></h2>
      <div class="nav"><button id="m-prev" title="Previous (←)">←</button><button id="m-next" title="Next (→)">→</button><button class="x" data-close>&times;</button></div>
    </div>
    <div id="m-body"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
