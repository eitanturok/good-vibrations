<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>viz2</title>
<link rel="stylesheet" href="/style.css">

<header id="bar">
  <div class="bhead"><div class="brand">viz2</div>
    <div id="summary" class="summary"></div></div>
</header>

<main>
<div id="flow">

  <!-- 1 . which recording -->
  <section class="card step">
    <h2><b>1</b> sample</h2>
    <div class="stepbody">
      <div class="pickers">
        <div class="pk"><span>sample <em id="nmatch"></em></span>
          <div class="combo">
            <input id="sid" autocomplete="off" spellcheck="false" placeholder="type an id">
            <div id="sidlist" hidden></div>
          </div>
          <em class="note">overrides the filters</em>
        </div>
        <div class="pk"><span>objects <button class="link" data-all="nobj">all</button><button class="link" data-none="nobj">none</button></span>
          <div class="chips nobj" id="nobjchips"></div>
        </div>
        <div class="pk lay"><span>layout <button class="link" data-all="layouts">all</button><button class="link" data-none="layouts">none</button></span>
          <div class="chips" id="layoutchips"></div>
        </div>
        <div class="pk"><span>speaker <button class="link" data-all="spk">all</button><button class="link" data-none="spk">none</button></span>
          <svg id="spk" tabindex="0"></svg></div>
        <div class="pk"><span>position <button id="empty" class="tog">empty</button>
          <em id="poscount"></em></span>
          <svg id="scatter" tabindex="0"></svg>
          <div id="repeats" hidden></div>
        </div>
      </div>
      <div class="scenes">
        <figure><img id="scene" alt=""><figcaption>overhead</figcaption></figure>
        <figure><img id="smask" alt=""><figcaption>segmentation mask</figcaption></figure>
      </div>
    </div>
  </section>

  <!-- 2 . the signal -->
  <section class="card step">
    <h2><b>2</b> signal <em id="heatread" class="soft"></em></h2>
    <p class="ptitle" id="sigtitle"></p>
    <div class="legend" id="siglegend"></div>
    <div class="stepbody">
      <div class="rail-l">
        <span class="cl">channel</span>
        <div class="seg chsel" id="ch">
          <button data-v="x">x</button><button data-v="y">y</button>
          <button data-v="avg" class="on">avg</button><button data-v="both">both</button>
        </div>
        <span class="cl">laser <em id="lasernow"></em></span>
        <svg id="grid" tabindex="0"></svg>
        <span class="cl">spectrum</span>
        <div class="seg chsel" id="specmode">
          <button data-v="magphase" class="on">mag+φ</button><button data-v="reim">re+im</button>
        </div>
        <span class="cl">scale</span>
        <div class="seg chsel" id="speclog">
          <button data-v="0">lin</button><button data-v="1" class="on">log</button>
        </div>
        <span class="cl">shifts</span>
        <div class="seg chsel" id="kind">
          <button data-v="raw">raw</button><button data-v="clean" class="on">clean</button>
        </div>
        <span class="cl">peaks <em id="npk"></em></span>
        <div class="pklist" id="pklist"></div>
      </div>
      <div class="vkey spacer"></div>
      <div class="lf">
        <div class="plot h150"><i class="yl" id="y1"></i><img class="hm" id="h1" alt="">
          <canvas id="p1"></canvas><svg class="ov" id="p1ov"></svg><i class="cb" id="cb1"></i></div>
        <div class="plot h110 gut"><i class="yl" id="y2"></i><img class="hm" id="h2" alt="">
          <canvas id="p2"></canvas><svg class="ov" id="p2ov"></svg><i class="cb" id="cb2"></i></div>
        <div class="plot h110 gut"><i class="yl" id="y3"></i><img class="hm" id="h3" alt="">
          <canvas id="p3"></canvas><svg class="ov" id="p3ov"></svg><i class="cb" id="cb3"></i></div>
      </div>
    </div>
  </section>

  <!-- 4 . the mode -->
  <section class="card step">
    <h2><b>3</b> mode</h2>
    <p class="ptitle" id="modetitle"></p>
    <div class="stepbody">
      <div class="rail-l">
        <span class="cl">animate</span>
        <button id="play" class="tog">▶ play</button>
        <span class="cl">arrow size</span>
        <input id="asize" type="range" min="0.3" max="3" step="0.1" value="1">
        <span class="cl">background</span>
        <label class="chk"><input type="checkbox" id="fieldbg"> color</label>
        <div id="modekey" hidden>
          <canvas id="fkey2d" width="88" height="88"></canvas>
          <em>hue = direction<br>bright = amplitude</em>
        </div>
      </div>
      <div class="vkey spacer"></div>
      <div class="lf">
      <div class="legend modelegend" id="modelegend"></div>
      <div class="modesplit">
        <div class="modeleft">
          <div class="modewrap">
            <i class="mlab my">laser row</i>
            <canvas id="mode" width="320" height="320"></canvas>
            <i class="mlab mx">laser column</i>
            <svg class="mode-ax" id="modeax"></svg>
          </div>
        </div>
        <div class="moderight">
          <div class="fgrid" id="fgrid"></div>
        </div>
      </div>
      </div>
    </div>
  </section>

  <!-- 5 . recovered audio -->
  <section class="card step">
    <h2><b>4</b> recovered audio</h2>
    <p class="ptitle" id="audtitle"></p>
    <div class="audio"><audio id="audio" controls preload="none"></audio></div>
    <div id="heldaudio"></div>
  </section>

</div>

<aside id="probes">
  <h2>masks</h2>
  <figure id="maskfig"><img id="allmasks" alt=""><figcaption>current + pinned</figcaption></figure>
  <h2>current</h2>
  <div id="now" class="probe live"></div>
  <h2 id="heldh">workbench <em class="addhint">press <kbd>Enter</kbd> to add</em><button id="clear" class="link">clear</button></h2>
  <div id="plist"></div>
</aside>
</main>
<script src="/app.js"></script>
